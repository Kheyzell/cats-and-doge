<app-card title="Récapitulatif">
  <div>
    {{ ticketInfo()?.ticketCount }} ticket(s)
  </div>

  @if (ticketInfo()?.isDiscountApplied) {
    <div>
        {{appliedDiscount * 100}}% de réduction appliqués
    </div>
  }
  
  <div>
    Prix total: {{ ticketInfo()?.dogeCoinAmount | number: '1.2-2' }} Dogecoin    
  </div>

  <div class="flex flex-row justify-end">
    <app-button [disabled]="true"> Valider le paiement </app-button>
  </div>
</app-card>
